# Compositor settings for ~/.config/knave/config.toml

[compositor]

modkey = "Alt"
# Initial master width in percent; stack receives the remainder (10..90).
master_percent = 50
# Order focus-switching shortcuts cycle a workspace's windows in:
# "layout" walks master then stack top to bottom, "mru" walks
# most-recently-focused windows first.
focus_cycle_order = "layout"
environment_file = "environment"

[compositor.input]
tap_to_click = true
natural_scroll = true
# Focus the window under the pointer while it moves. Set to false to
# switch window focus on click only.
focus_follows_mouse = true

# Screenshots save under ~/Pictures/Screenshots and post a notification with
# an image preview. `PRINT` selects a region, `SHIFT+PRINT` captures the
# focused output and `MOD+PRINT` the focused window. Add `CTRL` to copy to the
# clipboard instead of saving; copied captures are preview-only. A saved
# capture's notification shows its path and opens it with xdg-open when the
# notification is activated. Every entry below only overrides the default with
# the same keys, so define just the shortcuts you want to change.
# [[compositor.bind]]
# keys = "PRINT"
# dispatch = "screenshot"
# args = ["region", "save"]
# [[compositor.bind]]
# keys = "SHIFT+PRINT"
# dispatch = "screenshot"
# args = ["output", "save"]
# [[compositor.bind]]
# keys = "MOD+PRINT"
# dispatch = "screenshot"
# args = ["window", "save"]
# [[compositor.bind]]
# keys = "CTRL+PRINT"
# dispatch = "screenshot"
# args = ["region", "clipboard"]
# [[compositor.bind]]
# keys = "CTRL+SHIFT+PRINT"
# dispatch = "screenshot"
# args = ["output", "clipboard"]
# [[compositor.bind]]
# keys = "MOD+SHIFT+PRINT"
# dispatch = "screenshot"
# args = ["window", "clipboard"]

# Each entry overrides the default binding with the same keys; unmentioned
# defaults stay active and other entries are additions.
[[compositor.bind]]
keys = "MOD+Q"
dispatch = "exec"
args = ["bemenu-run"]

# Built-in window bindings, written explicitly so you can customize them.
# MOD follows modkey above (Super or Alt). Combine it with CTRL, SHIFT or ALT.
# Mouse names: BUTTON_LEFT, BUTTON_RIGHT, BUTTON_MIDDLE.
# A different combination adds a binding; it keeps the original default active.

# Move a floating window, or drag a tile and swap with its drop target.
# args = ["pointer"] selects the window under the pointer; omit args to use focus.
[[compositor.bind]]
keys = "MOD+BUTTON_LEFT"
dispatch = "move-window"
args = ["pointer"]

# Resize a floating window from the nearest corner; for tiles, adjust master width.
[[compositor.bind]]
keys = "MOD+BUTTON_RIGHT"
dispatch = "resize-window"
args = ["pointer"]

# Toggle the focused window between tiled and floating; remember floating geometry.
[[compositor.bind]]
keys = "MOD+V"
dispatch = "toggle-floating"

# Keyboard alternative: move the focused window with the pointer, then left click
# or press Enter to commit. Escape cancels. resize-window also supports this mode.
# [[compositor.bind]]
# keys = "MOD+SHIFT+G"
# dispatch = "move-window"

# Floating edges/corners and tiled dividers resize with an unmodified left drag.
# Horizontal stack dividers resize only their two neighbors. No binding is needed.
# Drag thresholds, hit margins and stack minimum heights currently have no setting.

# Return to the last workspace used; replace this combination to override it.
# TILDE and ~ are aliases for GRAVE (no Shift required).
[[compositor.bind]]
keys = "MOD+GRAVE"
dispatch = "last-workspace"
