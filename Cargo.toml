[package]
name = "villain"
version = "0.1.0"
edition = "2024"
description = "A tiling-first Wayland compositor and window manager for the Knave Desktop Environment"
license = "MIT"

[workspace]
members = []
resolver = "3"

[dependencies]
knave-capture-protocol = { git = "https://github.com/knave-de/knave.git", rev = "499584e2e68ddc4527157ca69d0c0c7d711e8daf", features = ["server"] }
libc = "0.2"
toml = "0.9"
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    "desktop",
    "wayland_frontend",
    "xwayland",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3.11"
knave-desktop-api = { git = "https://github.com/knave-de/knave.git", rev = "73f6548b026d2ecfffdc0bc9234ae0ab30d8bacc" }
knave-config = { git = "https://github.com/knave-de/knave.git", rev = "3ef4a82a2dd173999f0500515f69b79fc9c32b88" }
serde_json = "1"
base64 = "0.22"
png = "0.18"
wayland-protocols = { version = "0.32", features = ["server", "staging"] }

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
